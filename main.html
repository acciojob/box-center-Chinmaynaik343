<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Era Showcase</title>
</head>
<body style="background-image: url('https://www.globalfocusmagazine.com/wp-content/uploads/2020/02/Engaging_with_technology-scaled.jpg'); background-size: cover; background-repeat: no-repeat; background-position: center; height: 100vh; margin: 0; position: relative;">

    <!-- Centered Light-Blue Box with Position Property -->
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 200px; background-color: lightblue; border: 2px solid black;">
        <!-- Centered Text inside the box using position property -->
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: purple; font-family: Arial, sans-serif; text-align: center; width: 100%;">
            This is center.
        </div>
    </div>

</body>
</html>
